name = "tokentrap-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# ---------------------------------------------------------------- variables --
# All optional; sensible defaults are used when omitted.
[vars]
PERSONA = "Internal AI Assistant"
TRAP_STRENGTH = "aggressive"        # moderate | aggressive | maximum
RATE_LIMIT = "30"                   # POST /api/chat requests per minute per IP
# EXTRA_KEYWORDS = ""               # comma-separated additional trigger phrases
# CANARY_TOKENS = ""                # comma-separated canary tokens embedded in responses
# LOG_WEBHOOK = ""                  # https://... receives one JSON log line per interaction
# PHP2SHELL = "0"                   # "1" enables the HTTP PHP2Shell decoy
# PHP2SHELL_PROFILE = "generic"     # generic | wordpress | drupal | joomla
# PHP2SHELL_STRENGTH = "aggressive"
# PHP2SHELL_CANARY_TOKENS = ""      # falls back to generated trap canaries
# PHP2SHELL_SCAN_BYTES = "2097152"
# PHP2SHELL_PRESSURE_BYTES = "1048576"
# PHP2SHELL_WEBHOOK = ""

# ------------------------------------------------------------- KV binding ----
# Recommended: durable sessions across isolates and PoPs.
# 1. wrangler kv namespace create TRAP_SESSIONS
# 2. paste the returned id below, then uncomment:
#
# [[kv_namespaces]]
# binding = "TRAP_SESSIONS"
# id = "<YOUR_KV_NAMESPACE_ID>"

# ------------------------------------------------------ optional R2 logging --
# For full request archival (level 1+):
#
# [[r2_buckets]]
# binding = "TRAP_ARCHIVE"
# bucket_name = "tokentrap-archive"
