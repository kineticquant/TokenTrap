# Release publishing for both packages via OIDC trusted publishing.
#
# Prerequisites (one-time, GUI-configured):
#   PyPI: "Add a pending publisher" -> owner kineticquant, repo TokenTrap,
#         workflow name publish.yml, environment pypi
#   npm:  package Settings -> Trusted Publishers -> owner kineticquant,
#         repo TokenTrap, workflow name publish.yml, environment npm
#   GitHub repo Settings -> Environments -> create `pypi` and `npm`
#
# Release: push a tag ->  gh release create / git tag v1.0.1 && git push --tags

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: Publish tokentrap to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Upgrade pip and certifi
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install "certifi==2026.10.19"
      - name: Build sdist + wheel
        run: python -m pip install build && python -m build packages/backend-python
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/backend-python/dist

  npm:
    name: Publish tokentrap-ai to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      # Node 24 ships npm 11.x - tokenless trusted publishing requires npm >= 11.5.1.
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build widget
        run: npm run build -w tokentrap-ai
      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/widget
